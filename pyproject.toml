[project]
name = "job-search-tracker"
version = "1.0.0"
description = "Local web app to follow job applications and generate tailored one-page CVs, with an AI assistant and an MCP server."
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = [".venv", "data", "output"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear (likely bugs), pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
  "E731",   # small lambdas assigned to names are used deliberately
  "B006",   # list defaults in action signatures are copied by pydantic, never mutated
  "B008",   # FastAPI's Body()/File() defaults
  "UP045",  # Optional[...] kept in action signatures: it reads better in the generated schemas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]                              # long literal test data
"jobtracker/auth.py" = ["E501"]                   # inline login page HTML/CSS
"jobtracker/services/cv_import.py" = ["E501"]     # LLM prompt text
