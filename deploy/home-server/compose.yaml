# Home server deployment: runs the image published by CI (no build, no source code needed).
# Start: docker compose up -d     Update: docker compose pull && docker compose up -d (update.ps1 does it)
name: jobsearch

services:
  app:
    image: ghcr.io/samguercho/job-search-tracker:${IMAGE_TAG:-latest}
    # Only reachable from this machine; Tailscale (`tailscale serve`) publishes it to your devices over https
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Inside the container: fixed. PORT in .env only chooses the port on this PC (see ports above).
      PORT: "8000"
      JOBTRACKER_DATA_DIR: /data
      JOBTRACKER_OUTPUT_DIR: /output
      # Several users: Tailscale says who is visiting (only reachable through `tailscale serve`, see ports);
      # each Tailscale login gets its own data. Whoever you share this PC with in Tailscale can use it.
      JOBTRACKER_TAILSCALE_USERS: "1"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      - ${HOST_OUTPUT_DIR:-./companies}:/output
      # Codex's sign-in (your ChatGPT account) for the "Prepare interview" button: keep it out of backups you share
      - ${HOST_CODEX_DIR:-./codex}:/codex
      # Chat telemetry (SQLite), shared with the monitor. A Docker volume, not a Windows folder: SQLite's locking
      # is only reliable on the Linux side. Stays on this PC: not in data, so never in the OneDrive backups.
      - telemetry:/telemetry
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The monitor: dashboard and traces of the assistant's turns (owner only). Same image, its own port.
  # Publish it with `tailscale serve --bg --https=8443 8100` → https://<pc-name>.<tailnet>.ts.net:8443
  monitor:
    image: ghcr.io/samguercho/job-search-tracker:${IMAGE_TAG:-latest}
    command: ["python", "-m", "jobtracker", "monitor", "--port", "8100"]
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8100}:8100"
    env_file:
      - .env
    environment:
      JOBTRACKER_DATA_DIR: /data          # only to know who the owner is (owner.txt, master CV email)
      JOBTRACKER_TAILSCALE_USERS: "1"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/data
      - telemetry:/telemetry
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telemetry:
